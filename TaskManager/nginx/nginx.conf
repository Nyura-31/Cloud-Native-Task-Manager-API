# Upstream service definition: Docker Compose resolves "api" to the API container.
upstream task_manager_api {
    server api:3000;
}

server {
    # Public HTTP listener for requests made to the reverse proxy.
    listen 80;
    server_name _;

    # Health endpoint proxy configuration.
    location /health {
        proxy_pass http://task_manager_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Task API proxy configuration. This prefix also supports /tasks/:id.
    location /tasks {
        proxy_pass http://task_manager_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Only the API routes above are exposed through this reverse proxy.
    location / {
        return 404;
    }
}
