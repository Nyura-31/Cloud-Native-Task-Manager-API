name: Node.js CI

# Run validation whenever main changes or is proposed to change.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only needs read access to repository contents.
permissions:
  contents: read

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TaskManager

    steps:
      # Retrieves the repository source code for this workflow run.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installs the current Node.js LTS release and restores the npm cache.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: TaskManager/package-lock.json

      # Installs exactly the dependency versions recorded in package-lock.json.
      - name: Install dependencies
        run: npm ci

      # Runs project tests when available; otherwise performs a clean server startup smoke test.
      - name: Run tests or verify server startup
        run: |
          if node -e "const { scripts = {} } = require('./package.json'); process.exit(scripts.test ? 0 : 1)"; then
            npm test
          else
            echo "No npm test script found; running server startup smoke test."
            node -e "const app = require('./src/app'); const server = app.listen(0, '127.0.0.1', () => { console.log('Server started successfully.'); server.close((error) => { if (error) { console.error(error); process.exitCode = 1; } else { console.log('Server stopped cleanly.'); } }); }); server.on('error', (error) => { console.error(error); process.exitCode = 1; });"
          fi
